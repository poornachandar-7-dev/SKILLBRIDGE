<!DOCTYPE html>
    <html>
    <head>
        <title>SkillBridge - Institution Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * { box-sizing:border-box; } body { margin:0; background:#f8fafc; color:#172033; font-family:Inter,ui-sans-serif,system-ui,sans-serif; } .shell { max-width:1040px; margin:0 auto; padding:34px 20px 64px; } .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; } h1 { margin:0; font-size:32px; letter-spacing:-.03em; } .muted { color:#64748b; } .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(15,23,42,.05); margin-bottom:20px; } .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; } .stat { background:#eff6ff; border-radius:12px; padding:18px; } .stat strong { display:block; color:#1d4ed8; font-size:28px; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:13px 8px; border-bottom:1px solid #e2e8f0; } th { color:#64748b; font-size:12px; text-transform:uppercase; } .btn { border:0; border-radius:9px; padding:10px 14px; font-weight:700; cursor:pointer; background:#eff6ff; color:#2563eb; } @media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:14px}.table-wrap{overflow:auto}.card{padding:18px;}}
        </style>
    </head>
    <body><main class="shell"><div class="top"><div><div class="muted">SkillBridge · Institution</div><h1>Readiness Overview</h1><p class="muted">Aggregate insight into student skill readiness—without exposing private student records.</p></div><button class="btn" onclick="logout()">Log out</button></div><section class="card"><div class="stats"><div class="stat"><span class="muted">Students</span><strong id="studentCount">—</strong></div><div class="stat"><span class="muted">Assessed students</span><strong id="assessedCount">—</strong></div><div class="stat"><span class="muted">Overall readiness</span><strong id="readiness">—</strong></div></div></section><section class="card"><h2>Skill readiness</h2><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Average score</th><th>Strong students</th><th>Needs improvement</th></tr></thead><tbody id="skillRows"></tbody></table></div></section><section class="card"><h2>Focus area</h2><p id="focus" class="muted">Loading...</p></section></main><script>
        const token=localStorage.getItem('skillbridge_token'); if(!token) window.location.href='/login'; function logout(){localStorage.removeItem('skillbridge_token');localStorage.removeItem('skillbridge_user');window.location.href='/login';}
        async function loadStats(){const response=await fetch('/api/institution/stats',{headers:{'Authorization':`Bearer ${token}`}});if(response.status===401||response.status===403){window.location.href='/login';return;}const data=await response.json();document.getElementById('studentCount').textContent=data.student_count;document.getElementById('assessedCount').textContent=data.assessed_student_count;document.getElementById('readiness').textContent=data.overall_readiness+'%';document.getElementById('skillRows').innerHTML=data.skills.map(skill=>`<tr><td><strong>${skill.skill_name}</strong></td><td>${skill.average_score}%</td><td>${skill.strong_students}</td><td>${skill.needs_improvement}</td></tr>`).join('');document.getElementById('focus').textContent=data.common_skill_gap?`${data.common_skill_gap.skill_name} is the clearest focus area at ${data.common_skill_gap.average_score}% average readiness.`:'Assessment data will appear here once students complete an assessment.';}loadStats();
    </script></body></html>
