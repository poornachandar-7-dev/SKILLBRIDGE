<!DOCTYPE html>
    <html>
    <head>
        <title>SkillBridge - Login</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px auto; max-width: 440px; padding: 0 20px; line-height: 1.5; background: #f8fafc; color: #1e293b; }
            .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
            h1 { margin-top: 0; font-size: 24px; color: #0f172a; }
            .form-group { margin-bottom: 16px; }
            label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
            input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
            button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
            button:hover { background: #1d4ed8; }
            .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; font-size: 14px; }
            .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
            .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
            .footer-links { margin-top: 20px; text-align: center; font-size: 14px; color: #64748b; }
            .footer-links a { color: #2563eb; text-decoration: none; font-weight: 500; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Welcome Back</h1>
            <p style="color: #64748b; margin-top: -8px; margin-bottom: 20px;">Log in to access your SkillBridge dashboard.</p>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>

                <button type="submit" id="submitBtn">Log In</button>
            </form>

            <div class="footer-links">
                Don't have an account? <a href="/register">Register</a>
                <br><br>
                <a href="/">← Back to Homepage</a>
            </div>
        </div>

        <script>
            const form = document.getElementById('loginForm');
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            function showAlert(msg, isSuccess) {
                alertBox.textContent = msg;
                alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
                alertBox.style.display = 'block';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';
                alertBox.style.display = 'none';

                const payload = {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                };

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('skillbridge_token', data.access_token);
                        localStorage.setItem('skillbridge_user', JSON.stringify(data.user));

                        showAlert('Login successful! Welcome, ' + data.user.name + ' (' + data.user.role + ')', true);
                        
                        setTimeout(() => {
                            if (data.user.role === 'student') {
                                window.location.href = '/student';
                             } else if (data.user.role === 'industry') {
                                 window.location.href = '/industry';
                             } else {
                                 window.location.href = '/institution';
                             }
                        }, 1200);
                    } else {
                        showAlert(data.detail || 'Login failed.', false);
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Log In';
                    }
                } catch (err) {
                    showAlert('Network error. Is the server running?', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Log In';
                }
            });
        </script>
    </body>
    </html>
